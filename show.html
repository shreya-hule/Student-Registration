<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>

    <style>
        :root {
            --primary: #102a43;
            --primary-light: #243f5a;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --pass: #15803d;
            --fail: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 35px 15px;
            background:
                radial-gradient(circle at top left, #dcefeb, transparent 35%),
                var(--background);
            color: var(--text);
        }

        .container {
            max-width: 850px;
            width: 100%;
            margin: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(16, 42, 67, 0.10);
        }

        .header {
            background: linear-gradient(
                135deg, var(--primary), var(--primary-light)
            );
            color: white;
            padding: 28px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 54px;
            height: 54px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            border-radius: 15px;
            background: var(--accent);
            font-size: 27px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #cbd5e1;
        }

        .content {
            padding: 30px 32px;
        }

        h2 {
            color: var(--primary);
            font-size: 18px;
            margin-bottom: 18px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 22px;
            border-radius: 4px;
            background: var(--accent);
        }

        .student-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            padding: 20px;
            margin-bottom: 30px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .info-item {
            min-width: 0;
            padding: 12px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 9px;
            overflow-wrap: anywhere;
        }

        .info-label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .info-value {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: var(--primary);
            color: white;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #f0fdfa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .pass {
            color: var(--pass);
            font-weight: 700;
        }

        .fail {
            color: var(--fail);
            font-weight: 700;
        }

        .summary {
            padding: 22px;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
            border-radius: 12px;
        }

        .summary h2 {
            margin-bottom: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #ccfbf1;
        }

        .summary-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .summary-label {
            color: #475569;
            font-size: 14px;
        }

        .summary-value {
            color: var(--primary);
            font-size: 16px;
            font-weight: 700;
            text-align: right;
        }

        .percentage {
            color: var(--accent-hover);
            font-size: 22px;
        }

        .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .status.pass {
            background: #dcfce7;
            color: #166534;
        }

        .status.fail {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #99f6e4;
            outline-offset: 3px;
        }

        .back-btn {
            background: var(--accent);
            color: white;
        }

        .back-btn:hover {
            background: var(--accent-hover);
        }

        #studentInfo.no-data {
            display: block;
            color: #92400e;
            background: #fffbeb;
            border-color: #fde68a;
            line-height: 1.7;
        }

        @media (max-width: 550px) {
            body {
                padding: 15px 9px;
            }

            .container {
                border-radius: 14px;
            }

            .header {
                padding: 23px 18px;
                gap: 12px;
            }

            .logo {
                width: 45px;
                height: 45px;
                font-size: 22px;
            }

            h1 {
                font-size: 22px;
            }

            .content {
                padding: 23px 17px;
            }

            .student-info {
                grid-template-columns: 1fr;
                padding: 12px;
                gap: 10px;
            }

            th, td {
                padding: 12px 10px;
                font-size: 12px;
            }

            .summary {
                padding: 17px;
            }

            .summary-label {
                font-size: 13px;
            }

            .percentage {
                font-size: 19px;
            }

            .actions button {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header class="header">
            <div class="logo" aria-hidden="true">🎓</div>
            <div>
                <h1>Student Result</h1>
                <p class="subtitle">
                    Academic performance report
                </p>
            </div>
        </header>

        <main class="content">
            <h2 class="section-title">Student Information</h2>

            <div class="student-info" id="studentInfo"></div>

            <h2 class="section-title">Subject-wise Marks</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Marks</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody id="marksTable"></tbody>
                </table>
            </div>

            <div class="summary" id="summary"></div>

            <div class="actions">
                <button class="back-btn"
                        onclick="window.location.href='index.html'">
                    &#8592; Back to Registration
                </button>
            </div>
        </main>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem("studentData"));

        const studentInfo = document.getElementById("studentInfo");
        const marksTable = document.getElementById("marksTable");
        const summary = document.getElementById("summary");

        if (!data) {
            studentInfo.classList.add("no-data");
            studentInfo.textContent =
                "No student data found. Please register first.";

            document.querySelectorAll(".section-title").forEach(
                heading => heading.style.display = "none"
            );

            summary.style.display = "none";
            document.querySelector(".table-wrapper").style.display = "none";
        } else {
            studentInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">Student Name</span>
                    <span class="info-value">${escapeHTML(data.name)}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Roll Number</span>
                    <span class="info-value">${escapeHTML(data.roll)}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Email Address</span>
                    <span class="info-value">${escapeHTML(data.email)}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Class</span>
                    <span class="info-value">${escapeHTML(data.studentClass)}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Division</span>
                    <span class="info-value">${escapeHTML(data.division)}</span>
                </div>
            `;

            const subjects = [
                ["English", data.english],
                ["Mathematics", data.maths],
                ["Marathi", data.science],
                ["Geography", data.computer],
                ["History", data.history]
            ];

            let total = 0;
            let passed = true;

            subjects.forEach(function(subject) {
                const name = subject[0];
                const marks = Number(subject[1]);

                total += marks;

                if (marks < 35) {
                    passed = false;
                }

                marksTable.innerHTML += `
                    <tr>
                        <td>${name}</td>
                        <td>${marks}/100</td>
                        <td class="${marks >= 35 ? "pass" : "fail"}">
                            ${marks >= 35 ? "Pass" : "Fail"}
                        </td>
                    </tr>
                `;
            });

            const percentage = (total / 500) * 100;

            summary.innerHTML = `
                <h2>Final Summary</h2>

                <div class="summary-row">
                    <span class="summary-label">Total Marks</span>
                    <span class="summary-value">${total}/500</span>
                </div>

                <div class="summary-row">
                    <span class="summary-label">Percentage</span>
                    <span class="summary-value percentage">
                        ${percentage.toFixed(2)}%
                    </span>
                </div>

                <div class="summary-row">
                    <span class="summary-label">Overall Result</span>
                    <span class="status ${passed ? "pass" : "fail"}">
                        ${passed ? "PASS" : "FAIL"}
                    </span>
                </div>
            `;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function(char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            });
        }
    </script>
</body>
</html>
