<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        :root {
            --primary: #102a43;
            --primary-light: #243f5a;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #dbe4ee;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 40px 16px;
            background:
                radial-gradient(circle at top left, #dcefeb, transparent 35%),
                var(--background);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            background: var(--surface);
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(16, 42, 67, 0.10);
        }

        .header {
            background: linear-gradient(
                135deg, var(--primary), var(--primary-light)
            );
            padding: 30px 35px;
            color: white;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            width: 58px;
            height: 58px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: var(--accent);
            font-size: 29px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 7px;
            letter-spacing: 0.2px;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
        }

        form {
            padding: 30px 35px 35px;
        }

        h2 {
            font-size: 17px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        h2::before {
            content: "";
            display: block;
            width: 4px;
            height: 21px;
            border-radius: 5px;
            background: var(--accent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        label {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            min-height: 45px;
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #f8fafc;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s,
                        background 0.2s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover,
        select:hover {
            border-color: #94b8c6;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.13);
        }

        #studentForm h2:not(:first-child) {
            margin-top: 34px;
        }

        .buttons {
            display: flex;
            gap: 14px;
            margin-top: 35px;
        }

        button {
            flex: 1;
            min-height: 47px;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s,
                        box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #99f6e4;
            outline-offset: 3px;
        }

        .submit-btn {
            color: #ffffff;
            background: var(--accent);
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.18);
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 15px rgba(13, 148, 136, 0.25);
        }

        .reset-btn {
            color: #334155;
            background: #e8eef4;
        }

        .reset-btn:hover {
            background: #dbe4ee;
        }

        #result {
            margin: 0 35px 30px;
            padding: 18px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            color: #065f46;
            display: none;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px 10px;
            }

            .container {
                border-radius: 14px;
            }

            .header {
                padding: 24px 20px;
                gap: 13px;
            }

            .logo {
                width: 46px;
                height: 46px;
                font-size: 23px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 12px;
            }

            form {
                padding: 24px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            h2 {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
                gap: 10px;
            }

            #result {
                margin: 0 20px 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="logo" aria-hidden="true">🎓</div>
            <div>
                <h1>Student Registration</h1>
                <p class="subtitle">
                    Student information &amp; academic records
                </p>
            </div>
        </header>

        <form id="studentForm">

            <h2>Personal Details</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name"
                           placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="roll">Roll Number</label>
                    <input type="text" id="roll"
                           placeholder="Enter roll number" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="Enter 10-digit number"
                           pattern="[0-9]{10}"
                           title="Enter a 10-digit phone number" required>
                </div>

                <div class="form-group">
                    <label for="class">Class</label>
                    <select id="class" required>
                        <option value="">Select class</option>
                        <option>FY</option>
                        <option>SY</option>
                        <option>TY</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="division">Division</label>
                    <select id="division" required>
                        <option value="">Select division</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                    </select>
                </div>
            </div>

            <h2>Subject Marks (Out of 100)</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label for="english">English</label>
                    <input type="number" id="english"
                           min="0" max="100" step="1"
                           placeholder="Enter marks (0–100)" required>
                </div>

                <div class="form-group">
                    <label for="maths">Mathematics</label>
                    <input type="number" id="maths"
                           min="0" max="100" step="1"
                           placeholder="Enter marks (0–100)" required>
                </div>

                <div class="form-group">
                    <label for="science">Marathi</label>
                    <input type="number" id="science"
                           min="0" max="100" step="1"
                           placeholder="Enter marks (0–100)" required>
                </div>

                <div class="form-group">
                    <label for="computer">Geography</label>
                    <input type="number" id="computer"
                           min="0" max="100" step="1"
                           placeholder="Enter marks (0–100)" required>
                </div>

                <div class="form-group">
                    <label for="history">History</label>
                    <input type="number" id="history"
                           min="0" max="100" step="1"
                           placeholder="Enter marks (0–100)" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" id="btn" class="submit-btn">
                    Submit Details
                </button>

                <button type="reset" class="reset-btn">
                    Reset Form
                </button>
            </div>

        </form>

        <div id="result" aria-live="polite"></div>
    </div>

    <script src="hello.js"></script>

</body>
</html>
